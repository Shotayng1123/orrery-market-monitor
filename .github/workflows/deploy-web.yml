name: deploy-web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  # a pull request that touches the site runs the checks only; nothing is published from it
  pull_request:
    paths: ["web/**", "sim/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, a newer push replacing a waiting one. The checks of a pull request are a group of their
# own, so they can neither cancel a publish nor be cancelled by one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # The browser checks (web/e2e: 49 suites) and the logic checks (sim/logic.test.ts). Since 18 Nov 2026 the site is
  # published only when they pass: until then a publish checked only that the site builds. The limit was 20 minutes
  # when the checks took three. On 21 Nov 2026 the browser run of 2,052 checks in 34 suites took 14.5 minutes on the
  # engineer's machine and 13 here, before the installs; the 49 suites of pull request #50 (3,156 checks) took 28.1 there
  # (1,687 s) and 20.8 here (1,247 s), and with the checks of its final review (3,179) 29.7 there (1,781 s) and, in one
  # job, 25 min 17 s here of the job's 30 (23 Nov 2026). So since the fixes after that review's check the browser checks
  # run as two jobs of about equal time, `test` (web/e2e/run.cjs --part=1, with the logic checks) and `test-2`
  # (--part=2: every suite not in run.cjs's PART_ONE, the built site's among them), each with its own 30 minutes, and a
  # publish needs both. One suite is stopped at six minutes (web/e2e/run.cjs) and tried again; the longest, opens, takes
  # about 3.1 on the engineer's machine.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            jobs/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node e2e/run.cjs --part=1
        working-directory: web
      - run: npm ci && npx tsx ../sim/logic.test.ts
        working-directory: jobs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-1
          path: web/e2e/.out
          include-hidden-files: true
          retention-days: 7

  test-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node e2e/run.cjs --part=2
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-2
          path: web/e2e/.out
          include-hidden-files: true
          retention-days: 7

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables): the Monitor API URL.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, test, test-2]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
