name: deploy-web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  # a pull request that touches the site runs the checks only; nothing is published from it
  pull_request:
    paths: ["web/**", "sim/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, a newer push replacing a waiting one. The checks of a pull request are a group of their
# own, so they can neither cancel a publish nor be cancelled by one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # The browser checks (web/e2e: 3,179 of them in 49 suites on 22 Nov 2026) and the logic checks (sim/logic.test.ts,
  # 856 of them). Since 18 Nov 2026 the site is published only when they pass: until then a publish checked only that
  # the site builds. The limit was 20 minutes when the checks took three. On 21 Nov 2026 the browser run of 2,052
  # checks in 34 suites took 14.5 minutes on the engineer's machine and 13 here, before the installs; with the three
  # suites added that day it took 17.2 minutes on the engineer's machine (1,029 s) and 16.3 here (977 s, pull request
  # #49); with the paper portfolio's three after them (40 suites) 18.9 minutes there (1,136 s), and with the suite
  # and the wider drawings of the fixes after that day's checks (41 suites) 19.5 (1,169 s), and with the suite of
  # the fixes after the second review of P-1 (42 suites, 22 Nov) 20.1 (1,204 s), which by the ratio of pull request
  # #49 is about 19 here; the 49 suites of pull request #50 (3,156 checks) took 28.1 there (1,687 s) and 20.8 here
  # (1,247 s), and with the checks of its final review (3,179) 29.7 there (1,781 s, the machine loaded by other work).
  # The limit stays 30: a run cut off by the clock would stop a publish. One
  # suite is stopped at six minutes (web/e2e/run.cjs) and tried again; the longest, opens, takes about 3.1 on the
  # engineer's machine.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            jobs/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node e2e/run.cjs
        working-directory: web
      - run: npm ci && npx tsx ../sim/logic.test.ts
        working-directory: jobs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: web/e2e/.out
          include-hidden-files: true
          retention-days: 7

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables): the Monitor API URL.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
