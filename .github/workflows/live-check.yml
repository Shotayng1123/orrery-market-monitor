name: live-check

# A read-only look at the live database (jobs/live_check.ts): what the jobs last did, whether EQUITIES has today's
# quotes, the alerts of the last two days, the reasons for big moves and their cost, the EDINET DB allowance.
# It changes nothing and prints market data and counts only. By hand: Actions > live-check > Run workflow.
# "stock" runs the server's own reads for an instrument's page and a stock's NEWS (supabase/functions/_shared/
# pagefeed.ts) against the live tables, for USD/JPY, ^TNX, JGB 10Y and 7203.T: worth a run after a server deploy.
# One part is not read-only and runs only when asked for by name: "token" has the database ask GitHub to start a
# run of this check (its counts part) and prints GitHub's answer, which is how a stored token is tried out.
# Another runs only by name: "keys" tries the owner's source keys (jobs/live_keys.ts): for SEC_USER_AGENT,
# EDINET_API_KEY and BLS_API_KEY, "set" or "not set" and the HTTP status of one or two requests with each; never a
# value. Those three secrets go to that step alone.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Parts to print, comma-separated (jobs, relay, sources, market, source, equities, alerts, reasons, edinet, stock, counts); empty for all. token = try the stored GitHub token; keys = try the owner's source keys (SEC, EDINET, BLS)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - name: Look at the live database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_CHECK_ONLY: ${{ github.event.inputs.only || '' }}
        run: npx tsx live_check.ts
      - name: The owner's source keys (by name only)
        if: contains(github.event.inputs.only, 'keys')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: npx tsx live_keys.ts
