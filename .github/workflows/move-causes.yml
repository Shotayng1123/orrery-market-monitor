name: move-causes

# The reasons for big moves on the stock pages (Shota, 18 Nov 2026). A page of a large company puts each big move
# without a reason on a queue; this job looks each one up with web search and stores the reported reason with
# its sources, or "not found" (jobs/move_causes.ts). Each look-up costs model tokens and searches; the run prints
# the cost of each and the total. Measured on 18 Nov 2026: USD 0.22 a look-up on average (0.09 to 0.43, by the
# number of searches it needed), so a run of 30, the default, is about USD 7.
#   - Normally started by the database the moment a page queues a move (move_causes_kick, at most once in ten
#     minutes; it needs the GitHub token stored for the Morning Note, supabase/README.md).
#   - Once a day by GitHub's own schedule, as the fallback when that token is not stored.
#   - By hand: Actions > move-causes > Run workflow.
on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "How many moves to look up at most in this run"
        required: false
        default: "30"
      dry:
        description: "Dry run (ask and print, store nothing)"
        required: false
        default: "false"
      again:
        description: "Also look again at moves stored as 'no report found' (true/false)"
        required: false
        default: "false"
      symbol:
        description: "Only this stock's moves (a symbol such as CRWV or 7203.T); empty for all"
        required: false
        default: ""
      redo:
        description: "With a symbol: look up its moves again even where an answer is stored (true/false)"
        required: false
        default: "false"
      trace:
        description: "Print what each look-up did: its searches, the pages returned, its reply (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# one run at a time; a second request waits for the first, it is not dropped
concurrency:
  group: move-causes
  cancel-in-progress: false

jobs:
  look-up:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - name: Look the moves up
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOVE_CAUSE_MODEL: ${{ vars.MOVE_CAUSE_MODEL }}
          MOVE_CAUSE_EFFORT: ${{ vars.MOVE_CAUSE_EFFORT }}
          MOVE_CAUSE_SEARCHES: ${{ vars.MOVE_CAUSE_SEARCHES }}
          MAX: ${{ github.event.inputs.max || '30' }}
          DRY: ${{ github.event.inputs.dry || 'false' }}
          AGAIN: ${{ github.event.inputs.again || 'false' }}
          TRACE: ${{ github.event.inputs.trace || 'false' }}
          SYMBOL: ${{ github.event.inputs.symbol || '' }}
          REDO: ${{ github.event.inputs.redo || 'false' }}
        run: |
          ARGS="--max $MAX"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "$AGAIN" = "true" ]; then ARGS="$ARGS --again"; fi
          if [ "$TRACE" = "true" ]; then ARGS="$ARGS --trace"; fi
          # the symbol goes in as one quoted word; the job refuses anything that is not a symbol
          if [ "$REDO" = "true" ]; then ARGS="$ARGS --redo"; fi
          if [ -n "$SYMBOL" ]; then npx tsx move_causes.ts $ARGS --symbol "$SYMBOL"; exit $?; fi
          npx tsx move_causes.ts $ARGS
