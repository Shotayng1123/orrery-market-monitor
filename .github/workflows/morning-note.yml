name: morning-note

# The note is due at 07:00 SGT (23:00 UTC), Monday to Saturday (Saturday covers Friday's US session). On Sundays
# the job starts and stops at once: the weekly view is the Friday Weekly Strategy (weekly-strategy.yml).
# It must arrive without anyone opening anything.
#   - Since 18 Nov 2026 the database asks for the note itself at 22:15 UTC (pg_cron job monitor-morning-note,
#     migration 20261118000002: a workflow_dispatch with if_missing=true). pg_cron is punctual, and runs started
#     by an event rather than by GitHub's clock have begun within seconds in this repository, so this is the run
#     that normally writes the note. It needs a GitHub token stored in the database (supabase/README.md);
#     without one, what follows is all there is, as before.
# GitHub's own schedule stays as the fallback, built for GitHub's habits:
#   - GitHub starts this repository's scheduled runs 3.5 to 6.5 hours late (measured 9-15 Nov 2026). The main run
#     is requested at 17:10 UTC and its first step waits until 22:15 UTC (writing and reviewing the note on Fable 5.2 at xhigh effort takes
#     up to three quarters of an hour); a run that starts later goes at once.
#   - Two backup requests (22:20 and 01:30 UTC). Each run first checks whether today's note is already stored
#     (--if-missing) and stops if it is, so a backup only writes when the main run failed or never started.
#   - The writing step is tried up to three times, two minutes apart, before the run is marked failed.
on:
  schedule:
    - cron: "10 17 * * *"
    - cron: "20 22 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Note date (YYYY-MM-DD, SGT). Empty = today"
        required: false
        default: ""
      dry:
        description: "Dry run (print only)"
        required: false
        default: "false"
      pack_only:
        description: "Build the numbers pack and print what is in it; no model is asked, nothing is stored (true/false)"
        required: false
        default: "false"
      if_missing:
        description: "Write only if the note is not stored yet (the database's 22:15 UTC request sets this)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: morning-note
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: jobs
    steps:
      - name: Wait until 22:15 UTC
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 22:15" +%s)
          if [ "$(date -u +%H)" -lt 12 ]; then target=0; fi   # started after midnight UTC: already late, go
          if [ "$now" -lt "$target" ]; then echo "waiting $((target - now)) s"; sleep $((target - now)); fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - name: Write the note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.if_missing }}" = "true" ]; then ARGS="--if-missing"; fi
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ github.event.inputs.pack_only }}" = "true" ]; then ARGS="$ARGS --pack-only"; fi
          for attempt in 1 2 3; do
            if npx tsx morning_note.ts $ARGS; then exit 0; fi
            echo "attempt $attempt failed"; if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          exit 1
