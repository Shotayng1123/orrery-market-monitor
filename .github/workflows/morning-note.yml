name: morning-note

on:
  schedule:
    # The note is due at 07:00 SGT (23:00 UTC) every day: weekday and Saturday notes, the weekly wrap-up on Sunday.
    # GitHub starts this repository's scheduled runs 3.5 to 6.5 hours late (measured 9-15 Nov 2026), so the run is
    # requested at 17:10 UTC and its first step waits until 22:50 UTC; a run that starts later than that goes at once.
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Note date (YYYY-MM-DD, SGT). Empty = today"
        required: false
        default: ""
      dry:
        description: "Dry run (print only)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: morning-note
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: jobs
    steps:
      - name: Wait until 22:50 UTC
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 22:50" +%s)
          if [ "$(date -u +%H)" -lt 12 ]; then target=0; fi   # started after midnight UTC: already late, go
          if [ "$now" -lt "$target" ]; then echo "waiting $((target - now)) s"; sleep $((target - now)); fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - name: Write the note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          npx tsx morning_note.ts $ARGS
