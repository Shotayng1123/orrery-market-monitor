name: deploy-server

# The server (database changes, the notification key, the three functions) is deployed from main, like the website
# (Shota, 18 Nov 2026). Until then it was deployed by hand from one laptop, which held the only keys, so a change
# written anywhere else waited for that laptop. The keys are repository secrets now (supabase/README.md):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD   needed; without them this workflow says so and does nothing
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY       already there for the jobs
#   NOTE_DISPATCH_TOKEN                           optional: the GitHub token that lets the database start the Morning Note
#   SMTP_USER + SMTP_PASS, or RESEND_API_KEY + MAIL_FROM   optional: the sender of new accounts' verification emails
#                                                 (also SMTP_HOST, SMTP_PORT; supabase/README.md, "Accounts by email")
#   EDINETDB_API_KEY                              optional: the EDINET DB key behind Japanese companies' statements on the
#                                                 stock page (supabase/README.md, "The stock page and its sources")
# A push to main that touches the server deploys it. Run by hand it only shows what a deploy would do ("check"),
# unless "deploy" is chosen.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/functions/**", "supabase/config.toml", "jobs/tools/deploy_guard.jq", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = show what a deploy would change and change nothing; deploy = do it"
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

# one at a time, and a deploy under way is never cancelled half-way through a database change
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NOTE_DISPATCH_TOKEN: ${{ secrets.NOTE_DISPATCH_TOKEN }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
    steps:
      - name: Are the keys in place?
        id: keys
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::notice title=Not set up yet::The repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are not both there (supabase/README.md). Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*$#\1#')
            echo "::add-mask::$ref"
            echo "REF=$ref" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "mode: $MODE"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json

      # nothing is deployed if the logic checks fail
      - name: Logic checks
        if: steps.keys.outputs.ready == 'true'
        working-directory: jobs
        run: npm ci && npx tsx ../sim/logic.test.ts && bash ../sim/deploy_guard.test.sh

      # Pinned on purpose. Version 3 of the CLI changed which database a command talks to (the local one unless
      # --remote is given) and what it prints, and "latest" brought that in unannounced: the first real run of
      # this workflow (18 Nov 2026) stopped for it. A newer version is taken by changing this number, after
      # reading that version's help for the commands below.
      - uses: supabase/setup-cli@v1
        if: steps.keys.outputs.ready == 'true'
        with:
          version: 3.2.0
      - name: Link the project
        if: steps.keys.outputs.ready == 'true'
        run: supabase link --project-ref "$REF"

      # --remote = the linked project (the CLI's default is a database on this machine). The list of migrations is
      # asked for as JSON, which reads the same whatever the CLI decides to print for people.
      - name: What a deploy would change
        if: steps.keys.outputs.ready == 'true'
        run: |
          set -o pipefail
          echo "== migrations: in the repository, and whether the database has each on record"
          # asked for as JSON, the CLI writes an error as JSON too, into the same place: show it, or the log says nothing
          if ! supabase migration list --remote --output-format json > /tmp/migrations.json; then
            echo "the list of migrations could not be read. The CLI's answer:"; cat /tmp/migrations.json; echo; exit 1
          fi
          jq -r '.migrations[] | if (.local // "") == "" then "\(.remote)   applied, but not in the repository" elif (.remote // "") == "" then "\(.local)   WAITING" else "\(.local)   applied" end' /tmp/migrations.json
          echo "== database changes waiting to be applied"
          supabase db push --remote --dry-run --output-format text
          echo "== functions as deployed now"
          supabase functions list --project-ref "$REF" --output-format text
          echo "== secrets the functions have (names only)"
          if ! supabase secrets list --project-ref "$REF" --output-format json > /tmp/secrets.out; then
            echo "the list of secrets could not be read. The CLI's answer:"; cat /tmp/secrets.out; echo; exit 1
          fi
          grep -oE '[A-Z][A-Z0-9]*(_[A-Z0-9]+)+' /tmp/secrets.out | sort -u

      # A deploy applies every migration the database has no record of. That is only right when the record is
      # complete: if the database was ever changed by hand, old migrations would look new and be run again. So a
      # deploy goes ahead only when what is waiting is strictly newer than everything already applied.
      - name: The database's record must match the repository
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy'
        run: |
          verdict=$(jq -r -f jobs/tools/deploy_guard.jq /tmp/migrations.json)
          echo "$verdict"
          case "$verdict" in OK*) ;; *) exit 1 ;; esac

      # --yes: version 3 of the CLI makes a change to a hosted project (database, secrets, functions) only when it is
      # said in so many words; nobody is here to be asked. The first deploy (18 Nov 2026) applied the database
      # changes and then stopped at the next step, which had no --yes.
      - name: Database changes
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy'
        run: supabase db push --remote --yes

      # made once, on the runner, and stored straight on the server: it is never shown and never in git
      - name: Notification key
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy'
        run: |
          # the list read in the step above, searched as plain text so it does not matter how the CLI lays it out.
          # A list in which the server's own sign-in secret cannot be found was not read properly: stop, rather
          # than make a second key over an existing one (a different key ends every phone's subscription
          # without telling anyone).
          if ! grep -q "MONITOR_TOKEN_SECRET" /tmp/secrets.out; then
            echo "the list of the server's secrets could not be read (MONITOR_TOKEN_SECRET is not in it): no key was made"; exit 1
          fi
          if grep -q "VAPID_PUBLIC_KEY" /tmp/secrets.out; then
            echo "the server already has its notification key"
          else
            node jobs/tools/gen_vapid.mjs > /dev/null
            supabase secrets set --env-file jobs/.env.vapid --project-ref "$REF" --yes > /dev/null
            rm -f jobs/.env.vapid
            echo "a notification key was made and stored on the server"
          fi

      # optional: what the Monitor sends a new account's verification email with, and the EDINET DB key for Japanese
      # companies' statements. Whichever of these repository secrets are set are stored on the server under the same
      # names; nothing already there is removed, and no value is printed.
      - name: Email sender and data keys
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy'
        run: |
          args=(); names=""
          for n in MAIL_FROM RESEND_API_KEY SMTP_USER SMTP_PASS SMTP_HOST SMTP_PORT EDINETDB_API_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then args+=("$n=$v"); names="$names $n"; fi
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no email-sender or data-key secrets in the repository: nothing stored (the server keeps whatever it already has)"
          else
            supabase secrets set "${args[@]}" --project-ref "$REF" --yes > /dev/null
            echo "stored on the server:$names"
          fi

      - name: Functions
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy'
        run: supabase functions deploy tick daily api --project-ref "$REF" --yes

      # optional: hands the database the token with which it asks GitHub for the Morning Note at 22:15 UTC
      - name: Morning Note token
        if: steps.keys.outputs.ready == 'true' && env.MODE == 'deploy' && env.NOTE_DISPATCH_TOKEN != ''
        run: |
          code=$(curl -sS -o /tmp/answer -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/monitor_set_github_token" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            --data "$(jq -n --arg t "$NOTE_DISPATCH_TOKEN" '{p_token: $t}')")
          if [ "$code" = "200" ]; then echo "the database holds the token that starts the Morning Note"
          else echo "::warning title=Morning Note token::could not be stored (HTTP $code): $(head -c 300 /tmp/answer)"; fi
